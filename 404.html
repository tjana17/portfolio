<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Janarthanan Kannan</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --smoky-black:     hsl(0, 0%, 7%);
      --eerie-black-1:   hsl(240, 2%, 13%);
      --eerie-black-2:   hsl(240, 2%, 12%);
      --jet:             hsl(0, 0%, 22%);
      --orange-yellow:   hsl(45, 100%, 72%);
      --light-gray:      hsl(0, 0%, 84%);
      --white:           hsl(0, 0%, 100%);
    }

    *, ::before, ::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--smoky-black);
      color: var(--light-gray);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grid lines */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .75) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--orange-yellow);
      opacity: 0;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0%   { transform: translateY(105vh) scale(0); opacity: 0; }
      10%  { opacity: .55; }
      90%  { opacity: .2; }
      100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
    }

    /* ── Main container ─────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 640px;
    }

    /* ── Terminal block ─────────────────────────────────────────── */
    .terminal {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--jet);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
      margin-bottom: 48px;
      text-align: left;
    }

    .terminal-bar {
      background: var(--eerie-black-1);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--jet);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-red    { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green  { background: #28c840; }

    .terminal-title {
      font-size: 12px;
      color: var(--light-gray);
      opacity: .5;
      margin: 0 auto;
      letter-spacing: .5px;
    }

    .terminal-body {
      background: var(--eerie-black-2);
      padding: 22px 24px 24px;
      font-size: 13px;
      line-height: 2;
    }

    .t-line {
      overflow: hidden;
      white-space: nowrap;
      max-width: 0;
    }

    .t-line:nth-child(1) { animation: reveal .45s steps(35) .2s forwards; }
    .t-line:nth-child(2) { animation: reveal .55s steps(42) .75s forwards; }
    .t-line:nth-child(3) { animation: reveal .40s steps(30) 1.4s forwards; }
    .t-line:nth-child(4) { animation: reveal .50s steps(38) 2.0s forwards; }
    .t-line:nth-child(5) { animation: reveal .40s steps(28) 2.65s forwards; }

    @keyframes reveal {
      to { max-width: 100%; }
    }

    .t-prompt { color: var(--orange-yellow); }
    .t-cmd    { color: var(--white); }
    .t-error  { color: hsl(0, 85%, 65%); }
    .t-ok     { color: hsl(140, 70%, 55%); }
    .t-dim    { color: var(--light-gray); opacity: .45; }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--orange-yellow);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink .85s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Glitch 404 ─────────────────────────────────────────────── */
    .glitch-wrap {
      margin-bottom: 20px;
      line-height: 1;
    }

    .glitch {
      font-size: clamp(88px, 22vw, 168px);
      font-weight: 600;
      color: var(--white);
      position: relative;
      display: inline-block;
      letter-spacing: -6px;
    }

    .glitch::before,
    .glitch::after {
      content: "404";
      position: absolute;
      inset: 0;
    }

    .glitch::before {
      color: var(--orange-yellow);
      clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%);
      animation: glitch-top 4s infinite linear;
    }

    .glitch::after {
      color: hsl(195, 100%, 60%);
      clip-path: polygon(0 62%, 100% 62%, 100% 100%, 0 100%);
      animation: glitch-bot 4s infinite linear;
    }

    @keyframes glitch-top {
      0%,  82%, 100% { transform: translate(0);        opacity: 0; }
      83%             { transform: translate(-4px, 1px); opacity: .85; }
      85%             { transform: translate(4px, -1px); opacity: .85; }
      87%             { transform: translate(-2px, 0);   opacity: .6; }
      89%             { transform: translate(0);         opacity: 0; }
    }

    @keyframes glitch-bot {
      0%,  88%, 100% { transform: translate(0);       opacity: 0; }
      89%             { transform: translate(4px, 2px); opacity: .8; }
      91%             { transform: translate(-4px, -1px); opacity: .8; }
      93%             { transform: translate(2px, 0);  opacity: .5; }
      95%             { transform: translate(0);       opacity: 0; }
    }

    /* ── Labels ─────────────────────────────────────────────────── */
    .subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--light-gray);
      opacity: .55;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 14px;
      color: var(--light-gray);
      opacity: .4;
      margin-bottom: 40px;
      font-weight: 300;
    }

    /* ── CTA button ─────────────────────────────────────────────── */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--orange-yellow);
      color: hsl(0, 0%, 8%);
      text-decoration: none;
      padding: 13px 30px;
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
      transition: transform .25s ease, box-shadow .25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-home::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .18);
      transform: translateX(-101%);
      transition: transform .3s ease;
    }

    .btn-home:hover::before { transform: translateX(0); }

    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px hsla(45, 100%, 72%, .28);
    }

    .btn-home svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <div class="particles" id="particles"></div>

  <div class="container">

    <!-- Terminal -->
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">bash — portfolio ~</span>
      </div>
      <div class="terminal-body">
        <div class="t-line"><span class="t-prompt">~/portfolio</span>&nbsp;<span class="t-cmd">$ curl -I https://tjana17.github.io/portfolio/???</span></div>
        <div class="t-line"><span class="t-error">✕  HTTP/1.1 404 Not Found</span></div>
        <div class="t-line"><span class="t-dim">Date: <span id="err-date"></span></span></div>
        <div class="t-line"><span class="t-ok">→  Hint: try navigating back to /portfolio/</span></div>
        <div class="t-line"><span class="t-prompt">~/portfolio</span>&nbsp;<span class="t-cmd">$ </span><span class="cursor"></span></div>
      </div>
    </div>

    <!-- Glitch number -->
    <div class="glitch-wrap">
      <span class="glitch">404</span>
    </div>

    <p class="subtitle">Page Not Found</p>
    <p class="desc">This page doesn't exist or may have been moved.</p>

    <a href="./index.html" class="btn-home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back to Portfolio
    </a>

  </div>

  <script>
    // Live date in terminal
    document.getElementById('err-date').textContent = new Date().toUTCString();

    // Floating particles
    const wrap = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 1 + Math.random() * 2.5;
      p.style.cssText = [
        'left:'                + (Math.random() * 100) + '%',
        'width:'               + size + 'px',
        'height:'              + size + 'px',
        'animation-duration:'  + (7 + Math.random() * 11) + 's',
        'animation-delay:'     + (Math.random() * 9) + 's',
      ].join(';');
      wrap.appendChild(p);
    }
  </script>

</body>
</html>
